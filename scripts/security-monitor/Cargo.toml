[package]
name = "dashnix-security-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Unprivileged advisory collection and graphical-session report delivery"
license = "LGPL-3.0-only"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs"] }
wait-timeout = "0.2"
